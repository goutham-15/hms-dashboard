[project]
name = "hms-dashboard"
version = "0.2.0"
description = "HMS Medical Report Dashboard - API for processing and extracting medical reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.58",
    "fastapi>=0.109.0",
    "langchain>=1.2.10",
    "langchain-aws>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.2.16",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pypdf2>=3.0.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.47",
    "uvicorn>=0.27.0",
]

[project.scripts]
hms-api = "app.api.main:app"

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true
